name: WebGL Build

on:
  workflow_dispatch:

concurrency:
  group: webgl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: VocaNerd/Library
          key: Library-VocaNerd-WebGL-${{ hashFiles('VocaNerd/Packages/manifest.json', 'VocaNerd/Packages/packages-lock.json', 'VocaNerd/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-VocaNerd-WebGL-
            Library-VocaNerd-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: VocaNerd
          targetPlatform: WebGL
          buildMethod: VocaNerd.EditorTools.WebGLBuildScript.Build
          customParameters: -buildPath ../build/WebGL -cleanBuild

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: VocaNerd-WebGL
          path: build/WebGL
          if-no-files-found: error
          retention-days: 14
